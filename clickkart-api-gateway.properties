#======================
# Filter: Rate Limiter
spring.cloud.gateway.server.webflux.default-filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.default-filters[0].args.redis-rate-limiter.replenishRate=${RATE_LIMIT_REPLENISH:50}
spring.cloud.gateway.server.webflux.default-filters[0].args.redis-rate-limiter.burstCapacity=${RATE_LIMIT_BURST:100}
spring.cloud.gateway.server.webflux.default-filters[0].args.redis-rate-limiter.requestedTokens=1
spring.cloud.gateway.server.webflux.default-filters[0].args.key-resolver=#{@keyResolver}

# Filter: Header Deduplication
#
# The Gateway sets CORS headers and so does every downstream service, both deliberately - each
# service is independently reachable and cannot rely on the Gateway being in front of it. On a
# proxied request both fire, so the browser sees the header twice and rejects the response:
#   "Access-Control-Allow-Origin ... contains multiple values ... but only one is allowed".
# The request itself succeeds - a register returns 201 - but the body never reaches the page.
#
# The arg is `name`, NOT `headers`. DedupeResponseHeader's Config extends NameConfig, and its
# filter starts `String names = config.getName(); if (names == null) return;` - so a misnamed
# arg binds to nothing and the filter silently dedupes nothing. Space-separated, not commas.
spring.cloud.gateway.server.webflux.default-filters[1].name=DedupeResponseHeader
spring.cloud.gateway.server.webflux.default-filters[1].args.name=Access-Control-Allow-Origin Access-Control-Allow-Credentials
spring.cloud.gateway.server.webflux.default-filters[1].args.strategy=RETAIN_LAST

# Global CORS Settings
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
# Response headers script is allowed to read. Without Content-Disposition here the browser hides
# it from JS on a cross-origin download, so the filename the server chose is lost and the client
# has to fall back to one it composed itself (see FileDownloadService).
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers=Content-Disposition

#============================


# prometheus added: the Gateway is the one component every request passes through, so its request
# rate and latency are the closest thing the platform has to a single view of user-facing traffic.
# It was the only service omitting it.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
# Redis backs both rate-limiting and JWT revocation checks here - a Redis outage should take
# this instance out of the k8s Service's endpoint pool via the readiness probe, not just show
# up in /actuator/health. Confirmed missing by actually stopping Redis and observing
# /actuator/health/readiness stay UP - readinessState alone doesn't include the redis indicator.
management.endpoint.health.group.readiness.include=readinessState,redis

logging.level.root=INFO
logging.level.com.clickkart=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://clickkart-auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**

# Kept as its own route rather than folded into /api/v1/auth/** so the path the browser already
# knows keeps working after Captcha Service was merged into Auth Service. There is no /verify to
# route any more - it was server-to-server only and is now an in-process call.
spring.cloud.gateway.server.webflux.routes[1].id=captcha-challenge-via-auth
spring.cloud.gateway.server.webflux.routes[1].uri=lb://clickkart-auth-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/captcha/challenge

# Aggregated Swagger UI (springdoc-openapi-starter-webflux-ui) - one dropdown at the Gateway's
# own /swagger-ui.html that switches between every downstream service's real OpenAPI spec, each
# fetched through its own doc-proxy route below (exact-path RewritePath, not a business route -
# the Gateway itself has no custom API to document, see clickkart-api-gateway's OpenApiConfig).
spring.cloud.gateway.server.webflux.routes[2].id=auth-service-docs
spring.cloud.gateway.server.webflux.routes[2].uri=lb://clickkart-auth-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/docs/auth-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[2].filters[0]=RewritePath=/docs/auth-service/v3/api-docs, /v3/api-docs


spring.cloud.gateway.server.webflux.routes[3].id=audit-log-service-docs
spring.cloud.gateway.server.webflux.routes[3].uri=lb://clickkart-audit-log-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/docs/audit-log-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[3].filters[0]=RewritePath=/docs/audit-log-service/v3/api-docs, /v3/api-docs


# The Gateway generates no meaningful OpenAPI spec of its own (no business @RestController) -
# skip that generation and drive swagger-ui.html purely from the urls list below.
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/docs/auth-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Audit Log Service
springdoc.swagger-ui.urls[1].url=/docs/audit-log-service/v3/api-docs

# User Service. Appended as routes[6] rather than inserted after the captcha route so the existing
# doc-proxy indices [2]-[5] don't all have to shift - route order is irrelevant here because no two
# predicates overlap.
#
# Deliberately NOT added to gateway.security.public-paths: a customer's profile and address book are
# personal data, so every one of these endpoints requires a valid token, reads included. The service
# re-validates that token itself and ignores the X-User-Id header this Gateway sets, so a caller that
# reaches it directly cannot impersonate anyone.
spring.cloud.gateway.server.webflux.routes[4].id=user-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://clickkart-user-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/users/**

spring.cloud.gateway.server.webflux.routes[5].id=user-service-docs
spring.cloud.gateway.server.webflux.routes[5].uri=lb://clickkart-user-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/docs/user-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[5].filters[0]=RewritePath=/docs/user-service/v3/api-docs, /v3/api-docs

springdoc.swagger-ui.urls[2].name=User Service
springdoc.swagger-ui.urls[2].url=/docs/user-service/v3/api-docs

# Category Service. The catalog reads are genuinely public - a customer browses before signing in -
# so /api/v1/categories/** is in public-paths above.
#
# That list is matched on path alone and cannot distinguish GET from POST, so an ADMIN write also
# passes this Gateway's pre-check unauthenticated. It is rejected one hop later by the service,
# which validates the token itself and permits anonymous access to GET only. Widening the pre-check
# here does not widen what is actually permitted; the authorization boundary is the service, as it
# is for every other service on this platform.
spring.cloud.gateway.server.webflux.routes[6].id=categories-via-product
spring.cloud.gateway.server.webflux.routes[6].uri=lb://clickkart-product-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/v1/categories/**



# Property master data, served by Category Service under its own /api/v1/properties prefix rather
# than under /api/v1/categories. Without this route no predicate here matches and the Gateway
# answers 404 itself, which looks exactly like a missing controller one hop further in.
#
# Deliberately NOT in public-paths above: every path under this prefix is administration. The
# public read a seller form and the storefront facets make is /api/v1/categories/{id}/properties,
# already covered by the category route and its public-paths entry.
spring.cloud.gateway.server.webflux.routes[19].id=properties-via-product
spring.cloud.gateway.server.webflux.routes[19].uri=lb://clickkart-product-service
spring.cloud.gateway.server.webflux.routes[19].predicates[0]=Path=/api/v1/properties/**

# Product Service. Only the catalog READ paths are public - enumerated rather than a blanket
# /api/v1/products/**, because that prefix also carries the seller dashboard and the moderation
# queue. The PRD-* pattern cannot match the literal "seller" or "admin" segments, since a publicId
# is always PRD-<uuid>.
#
# The service still enforces the real boundary: it permits anonymous access to GET on those paths
# only, and requires ROLE_SELLER or ROLE_ADMIN for everything else.
spring.cloud.gateway.server.webflux.routes[7].id=product-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://clickkart-product-service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/v1/products/**

spring.cloud.gateway.server.webflux.routes[8].id=product-service-docs
spring.cloud.gateway.server.webflux.routes[8].uri=lb://clickkart-product-service
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/docs/product-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[8].filters[0]=RewritePath=/docs/product-service/v3/api-docs, /v3/api-docs

springdoc.swagger-ui.urls[3].name=Product Service
springdoc.swagger-ui.urls[3].url=/docs/product-service/v3/api-docs

# The brand vocabulary, served by Product Service under its own prefix. Reading is public: the
# customer-facing brand filter uses the same list and a signed-out shopper browsing by brand is
# the ordinary case. Adding requires ROLE_SELLER, enforced at the service.
spring.cloud.gateway.server.webflux.routes[20].id=product-service-brands
spring.cloud.gateway.server.webflux.routes[20].uri=lb://clickkart-product-service
spring.cloud.gateway.server.webflux.routes[20].predicates[0]=Path=/api/v1/brands/**

# Platform promotions - coupons, bank offers and the free-delivery threshold. Served by Product
# Service but outside its /api/v1/products prefix, so it needs its own route. Public, because a
# discount a signed-out shopper cannot see is a discount that never influences a basket.
spring.cloud.gateway.server.webflux.routes[21].id=product-service-promotions
spring.cloud.gateway.server.webflux.routes[21].uri=lb://clickkart-product-service
spring.cloud.gateway.server.webflux.routes[21].predicates[0]=Path=/api/v1/promotions/**

# Delivery estimates for a destination, with no product involved - what the checkout asks when
# it is pricing a whole basket rather than one listing.
spring.cloud.gateway.server.webflux.routes[22].id=product-service-delivery
spring.cloud.gateway.server.webflux.routes[22].uri=lb://clickkart-product-service
spring.cloud.gateway.server.webflux.routes[22].predicates[0]=Path=/api/v1/delivery/**

# Inventory Service. Only the availability reads are public, and they are banded rather than exact
# - a precise count polled over time reconstructs a competitor's sales volume. The seller routes
# (exact figures) and the internal reservation lifecycle are not in public-paths.
spring.cloud.gateway.server.webflux.routes[9].id=inventory-via-product
spring.cloud.gateway.server.webflux.routes[9].uri=lb://clickkart-product-service
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/api/v1/inventory/**



# Order Service (#10). Only /api/v1/orders/** is routed - /internal/v1/orders/** deliberately has no
# edge route, because the payment callback and the unscoped order read are shared-secret surfaces
# meant for other services, and a Gateway route would put them on the internet.
#
# Nothing here goes in public-paths. There is no such thing as a public order: every route names or
# implies a person, so all of them require a token. This is the first business service with no
# anonymous surface at all.
spring.cloud.gateway.server.webflux.routes[10].id=order-service
spring.cloud.gateway.server.webflux.routes[10].uri=lb://clickkart-order-service
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/api/v1/orders/**

spring.cloud.gateway.server.webflux.routes[11].id=order-service-docs
spring.cloud.gateway.server.webflux.routes[11].uri=lb://clickkart-order-service
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/docs/order-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[11].filters[0]=RewritePath=/docs/order-service/v3/api-docs, /v3/api-docs

springdoc.swagger-ui.urls[4].name=Order Service
springdoc.swagger-ui.urls[4].url=/docs/order-service/v3/api-docs

# Payment Service (#11). Two routes rather than one, because this service has two front doors.
spring.cloud.gateway.server.webflux.routes[12].id=payment-service
spring.cloud.gateway.server.webflux.routes[12].uri=lb://clickkart-payment-service
spring.cloud.gateway.server.webflux.routes[12].predicates[0]=Path=/api/v1/payments/**

# The processor webhook, and the one route on this platform that is public by necessity rather than
# by choice. A payment processor holds no account here: it has no bearer token to present and no
# shared secret header, so the Gateway must let it through unauthenticated and Payment Service
# authenticates it itself, by HMAC over the raw request body.
#
# This is why it is a separate route with its own exact path rather than a wildcard. /webhooks/** or
# a POST-only rule on the whole service would make anything the service later exposes under that
# prefix public too, and the next thing added under a "webhooks" prefix will not necessarily be
# signature-verified.
spring.cloud.gateway.server.webflux.routes[13].id=payment-service-webhook
spring.cloud.gateway.server.webflux.routes[13].uri=lb://clickkart-payment-service
spring.cloud.gateway.server.webflux.routes[13].predicates[0]=Path=/webhooks/v1/payments/gateway
spring.cloud.gateway.server.webflux.routes[13].predicates[1]=Method=POST

spring.cloud.gateway.server.webflux.routes[14].id=payment-service-docs
spring.cloud.gateway.server.webflux.routes[14].uri=lb://clickkart-payment-service
spring.cloud.gateway.server.webflux.routes[14].predicates[0]=Path=/docs/payment-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[14].filters[0]=RewritePath=/docs/payment-service/v3/api-docs, /v3/api-docs

springdoc.swagger-ui.urls[5].name=Payment Service
springdoc.swagger-ui.urls[5].url=/docs/payment-service/v3/api-docs

# Cart Service (#9). Only /api/v1/cart/** is routed - /internal/v1/carts/** deliberately has no edge
# route, because that is the seam Order Service checks out through and a Gateway route would put
# "read anyone's basket by user id" on the internet.
#
# Nothing here goes in public-paths. A cart belongs to a person, so every route needs a token.
spring.cloud.gateway.server.webflux.routes[15].id=cart-service
spring.cloud.gateway.server.webflux.routes[15].uri=lb://clickkart-cart-service
spring.cloud.gateway.server.webflux.routes[15].predicates[0]=Path=/api/v1/cart/**

spring.cloud.gateway.server.webflux.routes[16].id=cart-service-docs
spring.cloud.gateway.server.webflux.routes[16].uri=lb://clickkart-cart-service
spring.cloud.gateway.server.webflux.routes[16].predicates[0]=Path=/docs/cart-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[16].filters[0]=RewritePath=/docs/cart-service/v3/api-docs, /v3/api-docs

springdoc.swagger-ui.urls[6].name=Cart Service
springdoc.swagger-ui.urls[6].url=/docs/cart-service/v3/api-docs

# Admin Service (#14). Read-only cross-service operator views.
#
# One route and no docs-only special case, because there is no /internal/** to keep off the edge -
# this is the only service on the platform without one. Nothing needs to drive it: it owns no data,
# so an internal API would exist only to let something else read what it read from somewhere else.
spring.cloud.gateway.server.webflux.routes[17].id=admin-service
spring.cloud.gateway.server.webflux.routes[17].uri=lb://clickkart-admin-service
spring.cloud.gateway.server.webflux.routes[17].predicates[0]=Path=/api/v1/admin/**

spring.cloud.gateway.server.webflux.routes[18].id=admin-service-docs
spring.cloud.gateway.server.webflux.routes[18].uri=lb://clickkart-admin-service
spring.cloud.gateway.server.webflux.routes[18].predicates[0]=Path=/docs/admin-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[18].filters[0]=RewritePath=/docs/admin-service/v3/api-docs, /v3/api-docs

springdoc.swagger-ui.urls[7].name=Admin Service
springdoc.swagger-ui.urls[7].url=/docs/admin-service/v3/api-docs

# --- TLS ------------------------------------------------------------------
# Off by default so an existing checkout keeps working on plain HTTP until the keystore exists;
# turn it on with TLS_ENABLED=true once scripts/generate-dev-tls.sh has been run. The Gateway is
# the only service that terminates TLS, because it is the only one exposed outside the compose
# network - the rest are reachable only from inside it.
server.ssl.enabled=${TLS_ENABLED:false}
server.ssl.key-store=${TLS_KEYSTORE_PATH:/app/certs/gateway-keystore.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=gateway
# No default. A keystore password that falls back to a literal would be a published credential
# the moment this file is read, and these repositories are public.
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD}
