# clickkart-api-gateway-dev.properties
server.port=${SERVER_PORT:8080}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=${GATEWAY_HOSTNAME:localhost}
eureka.client.service-url.defaultZone=http://${EUREKA_DASHBOARD_USERNAME:admin}:${EUREKA_DASHBOARD_PASSWORD:dev-only-secret-change-me}@${EUREKA_SERVER_HOST:localhost}:${EUREKA_SERVER_PORT:8761}/eureka/

# dev-only fallback secret - never rely on this default outside a local machine. Must be
# the SAME value the Auth Service uses to sign tokens once it exists.
gateway.security.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum}
gateway.security.public-paths=/api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/refresh,/api/v1/auth/forgot-password,/api/v1/auth/reset-password,/api/v1/auth/otp/request,/api/v1/auth/otp/verify,/api/v1/captcha/challenge,/actuator/health,/docs/**,/swagger-ui.html,/swagger-ui/**,/webjars/**,/api/v1/categories/**,/api/v1/products/search,/api/v1/products/search/trending,/api/v1/promotions,/api/v1/promotions/**,/api/v1/delivery/**,/api/v1/brands,/api/v1/products/media/**,/api/v1/products/documents/*/file,/api/v1/products/PRD-*/documents,/api/v1/products/slug/**,/api/v1/products/PRD-*,/api/v1/products/PRD-*/reviews,/api/v1/products/PRD-*/reviews/summary,/api/v1/inventory/availability/**,/webhooks/v1/payments/gateway

spring.security.user.name=${GATEWAY_ADMIN_USERNAME:admin}
spring.security.user.password=${GATEWAY_ADMIN_PASSWORD:dev-only-secret-change-me}

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
#spring.data.redis.password=${REDIS_PASSWORD:clickkartredis123}

# Lettuce's own command timeout defaults to 60s when unset - confirmed live by actually killing
# Redis and watching both /actuator/health/readiness and JWT-revocation calls hang instead of
# failing fast, meaning the JwtAuthenticationGlobalFilter onErrorResume(DataAccessException)
# guard never got a chance to fire in time. Set short so a Redis outage surfaces as a fast error
# (and the readiness probe flips DOWN promptly) instead of a long stall.
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

