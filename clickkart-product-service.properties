# clickkart-product-service-dev.properties
server.port=${SERVER_PORT:8087}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clickkart_product}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# validate, not update. Flyway owns the schema now; Hibernate only checks the entities still
# match it. A mismatch becomes a refusal to start - loud, at deploy time - instead of a silent
# ALTER nobody reviewed, which is what made ddl-auto=update unsafe outside a laptop.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# What lets Flyway be adopted on a database that already has a schema: baseline-on-migrate
# stamps an existing non-empty database rather than refusing to run, and baseline-version=1
# stamps it AT V1 so it skips V1__baseline.sql, while a fresh database runs it and gets the lot.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false

# Same Redis instance Auth Service writes revoked jtis to, read-only here.
spring.data.redis.host=${REVOCATION_REDIS_HOST:localhost}
spring.data.redis.port=${REVOCATION_REDIS_PORT:6379}
spring.data.redis.password=${REVOCATION_REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=${PRODUCT_SERVICE_HOSTNAME:localhost}
eureka.client.service-url.defaultZone=http://${EUREKA_DASHBOARD_USERNAME:admin}:${EUREKA_DASHBOARD_PASSWORD:dev-only-secret-change-me}@${EUREKA_SERVER_HOST:localhost}:${EUREKA_SERVER_PORT:8761}/eureka/

product.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum}
product.revocation-key-prefix=${REVOCATION_KEY_PREFIX:revoked:jti:}
product.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
product.trusted-proxy-cidrs=${PRODUCT_TRUSTED_PROXY_CIDRS:}

# Three separate secrets, not one platform-wide key: this service is the first to hold two of
# someone else's, so a compromise here must yield only what this service was entitled to reach.
# internal-api-key guards its OWN /internal/**; the others are presented when calling theirs.
product.internal-api-key=${INTERNAL_API_KEY:dev-only-internal-key-change-me}
product.category-service-api-key=${CATEGORY_SERVICE_API_KEY:dev-only-internal-key-change-me}
product.user-service-api-key=${USER_SERVICE_API_KEY:dev-only-internal-key-change-me}
product.order-service-api-key=${ORDER_SERVICE_API_KEY:dev-only-internal-key-change-me}

spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.instances.clickkart-audit-log-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.clickkart-audit-log-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.clickkart-audit-log-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.clickkart-user-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.clickkart-user-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.clickkart-user-service.wait-duration-in-open-state=10s
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=2000
# Above the feign read-timeout so feign's own timeout is the operative bound.
resilience4j.timelimiter.configs.default.timeout-duration=12s

management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

spring.data.web.pageable.max-page-size=100

logging.level.root=INFO
logging.level.com.clickkart=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId:--}] %-5level %logger{36} - %msg%n

# ---------------------------------------------------------------------------
# Stock, folded in from clickkart-inventory-service, which no longer exists as
# its own deployable. It could not answer "how many can be sold" without calling
# this service to resolve the SKU first, so every stock write crossed a network
# boundary for data that has no meaning apart from the catalog it belongs to.
#
# Only the three settings that are genuinely about stock come across. The JWT
# secret, revocation prefix, CORS list, trusted proxies and internal key that
# file also carried are this service's own now - one filter chain, not two.
# ---------------------------------------------------------------------------
inventory.reservation-ttl-minutes=${RESERVATION_TTL_MINUTES:15}
inventory.sweep-batch-size=${SWEEP_BATCH_SIZE:200}
inventory.public-low-stock-threshold=${PUBLIC_LOW_STOCK_THRESHOLD:5}

# Read as @Scheduled placeholders by ReservationSweeper rather than bound to
# InventoryProperties, so they must exist as properties in their own right.
inventory.sweep-interval-ms=${SWEEP_INTERVAL_MS:60000}
inventory.sweep-initial-delay-ms=${SWEEP_INITIAL_DELAY_MS:30000}

# ---------------------------------------------------------------------------
# Taxonomy and property master data, folded in from clickkart-category-service,
# which no longer exists as its own deployable. Only the settings genuinely about
# the taxonomy come across; the JWT secret, revocation prefix, CORS list and
# trusted proxies that file also carried are this service's own now - one
# security filter chain, not two.
# ---------------------------------------------------------------------------
category.max-depth=${CATEGORY_MAX_DEPTH:5}
category.image-directory=${CATEGORY_IMAGE_DIRECTORY:./data/category-images}
category.image-base-url=${CATEGORY_IMAGE_BASE_URL:/api/v1/categories/images}
category.max-image-bytes=${CATEGORY_MAX_IMAGE_BYTES:4194304}
