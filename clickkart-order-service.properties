# clickkart-order-service-dev.properties
server.port=${SERVER_PORT:8089}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clickkart_order}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# validate, not update. Flyway owns the schema now; Hibernate only checks the entities still
# match it. A mismatch becomes a refusal to start - loud, at deploy time - instead of a silent
# ALTER nobody reviewed, which is what made ddl-auto=update unsafe outside a laptop.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# What lets Flyway be adopted on a database that already has a schema: baseline-on-migrate
# stamps an existing non-empty database rather than refusing to run, and baseline-version=1
# stamps it AT V1 so it skips V1__baseline.sql, while a fresh database runs it and gets the lot.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false

spring.data.redis.host=${REVOCATION_REDIS_HOST:localhost}
spring.data.redis.port=${REVOCATION_REDIS_PORT:6379}
spring.data.redis.password=${REVOCATION_REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=${ORDER_SERVICE_HOSTNAME:localhost}
eureka.client.service-url.defaultZone=http://${EUREKA_DASHBOARD_USERNAME:admin}:${EUREKA_DASHBOARD_PASSWORD:dev-only-secret-change-me}@${EUREKA_SERVER_HOST:localhost}:${EUREKA_SERVER_PORT:8761}/eureka/

order.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum}
order.revocation-key-prefix=${REVOCATION_KEY_PREFIX:revoked:jti:}
order.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
order.trusted-proxy-cidrs=${ORDER_TRUSTED_PROXY_CIDRS:}

# Guards this service's own /internal/** - the payment callback.
order.internal-api-key=${INTERNAL_API_KEY:dev-only-internal-key-change-me}
# Presented to the three services this one calls. Three separate keys rather than one, because they
# are not equally dangerous: the Inventory key can move a shop's stock, while the other two only read.
order.product-service-api-key=${PRODUCT_SERVICE_API_KEY:dev-only-internal-key-change-me}
order.inventory-service-api-key=${INVENTORY_SERVICE_API_KEY:dev-only-internal-key-change-me}
order.user-service-api-key=${USER_SERVICE_API_KEY:dev-only-internal-key-change-me}
# Reading the basket at checkout, and emptying it afterwards. Four downstream keys now, still one per
# service: the inventory key can move stock and this one can empty a basket, while the product and
# user keys only read - so a compromise of the weakest must not confer the strongest.
order.cart-service-api-key=${CART_SERVICE_API_KEY:dev-only-internal-key-change-me}

# A flat charge, not a rate card. Real shipping pricing needs weight, dimensions and carrier, none of
# which this platform models - a convincing calculation built on data that does not exist would be
# worse than an obvious placeholder, because it would be believed.
order.shipping-fee=${SHIPPING_FEE:49.00}
order.free-shipping-threshold=${FREE_SHIPPING_THRESHOLD:499.00}

# Closes checkouts that were never paid for. No faster than Inventory's own sweep - the stock cannot
# come back before that runs - and no slower, or customers stare at an order they can no longer pay for.
order.sweep-interval-ms=${SWEEP_INTERVAL_MS:60000}
# Longer than Inventory's initial delay: a starting replica must finish registering with Eureka before
# it can resolve clickkart-product-service (which absorbed Inventory Service), or its first sweep
# fails every release it attempts.
order.sweep-initial-delay-ms=${SWEEP_INITIAL_DELAY_MS:45000}
order.sweep-batch-size=${SWEEP_BATCH_SIZE:200}

spring.cloud.openfeign.circuitbreaker.enabled=true

# A 409 must never count as a failure, on any client here.
#
# Enabling the Feign circuit breaker applies one to EVERY client, named or not, so this cannot be
# arranged by simply omitting an instance block for Inventory. Without this line, a run of customers
# losing the race for the last unit - each a perfectly correct 409 - would trip the breaker and stop
# checkout for everyone, including the customers buying something that is in stock. The failure
# indistinguishable from success is exactly the failure mode a breaker is supposed to prevent, so
# pointing it at a business answer inverts its purpose.
#
# "default" is Resilience4j's base config: every instance below inherits it without asking.
resilience4j.circuitbreaker.configs.default.ignore-exceptions[0]=feign.FeignException$Conflict

resilience4j.circuitbreaker.instances.clickkart-audit-log-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.clickkart-audit-log-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.clickkart-audit-log-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.clickkart-product-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.clickkart-product-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.clickkart-product-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.clickkart-user-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.clickkart-user-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.clickkart-user-service.wait-duration-in-open-state=10s


# Inventory alone has no Feign fallback, unlike the other three clients. A fallback has to return
# something, and there is no substitute answer to "could you hold this stock" - "not enough stock"
# and "could not reach the service" put the order in the same terminal state but must not tell the
# customer the same thing. OrderServiceImpl inspects the thrown FeignException instead, which a
# fallback would have already swallowed.
spring.cloud.openfeign.client.config.default.connect-timeout=2000
# 5s, not the 2s every other service uses. Checkout is the platform's only fan-out path - one call
# to User for the address, then one to Product per line, then one to Inventory per line - and the
# first call to each service pays for LoadBalancer resolution and connection setup on top of the
# work itself. At 2s that cold first checkout timed out against a perfectly healthy Product Service
# and came back as a 503, which is a lie about a service that was answering fine a second later.
spring.cloud.openfeign.client.config.default.read-timeout=5000
# Longer than the default: reserving a multi-line basket is several sequential calls to Inventory,
# and the limiter has to cover all of them rather than one.
resilience4j.timelimiter.configs.default.timeout-duration=20s

management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

spring.data.web.pageable.max-page-size=100

logging.level.root=INFO
logging.level.com.clickkart=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId:--}] %-5level %logger{36} - %msg%n
