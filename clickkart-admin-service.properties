# clickkart-admin-service-dev.properties
server.port=${SERVER_PORT:8092}

# No spring.datasource at all. This service has no database - it owns no data, stores nothing, and
# assembles every number it returns from the service that owns it. Adding a datasource here would be
# the first step toward it keeping a copy of something, which is the thing to avoid.

spring.data.redis.host=${REVOCATION_REDIS_HOST:localhost}
spring.data.redis.port=${REVOCATION_REDIS_PORT:6379}
spring.data.redis.password=${REVOCATION_REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=${ADMIN_SERVICE_HOSTNAME:localhost}
eureka.client.service-url.defaultZone=http://${EUREKA_DASHBOARD_USERNAME:admin}:${EUREKA_DASHBOARD_PASSWORD:dev-only-secret-change-me}@${EUREKA_SERVER_HOST:localhost}:${EUREKA_SERVER_PORT:8761}/eureka/

admin.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum}
admin.revocation-key-prefix=${REVOCATION_KEY_PREFIX:revoked:jti:}
admin.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
admin.trusted-proxy-cidrs=${ADMIN_TRUSTED_PROXY_CIDRS:}

# Note what is absent: not one internal API key. Every other service that calls another holds at
# least one; this one forwards the operator's own bearer token instead, so each downstream service
# applies its own ROLE_ADMIN check against the real person. There is nothing here to steal.
admin.panel-timeout-ms=${ADMIN_PANEL_TIMEOUT_MS:3000}

spring.cloud.openfeign.circuitbreaker.enabled=true
# A downstream 4xx is an answer, not a fault. In particular a 403 from a service that disagrees about
# the operator's role must not trip a breaker and take the dashboard down for everyone.
resilience4j.circuitbreaker.configs.default.ignore-exceptions[0]=feign.FeignException$Conflict
resilience4j.circuitbreaker.configs.default.ignore-exceptions[1]=feign.FeignException$NotFound
resilience4j.circuitbreaker.configs.default.ignore-exceptions[2]=feign.FeignException$Forbidden

resilience4j.circuitbreaker.instances.clickkart-order-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.clickkart-order-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.clickkart-order-service.wait-duration-in-open-state=10s
# Keyed on the contextId, not the service name. PaymentAdminClient names clickkart-payment-service
# and carries contextId paymentAdminClient; Resilience4j derives the instance id from the context,
# so this block would not apply if it were keyed on the host.
resilience4j.circuitbreaker.instances.paymentAdminClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentAdminClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentAdminClient.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.clickkart-product-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.clickkart-product-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.clickkart-product-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.clickkart-user-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.clickkart-user-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.clickkart-user-service.wait-duration-in-open-state=10s

# Deliberately tighter than every other service's. A dashboard fans out to four services and a dozen
# calls, so a generous timeout multiplied by an outage is an operator watching a spinner during the
# exact incident this page exists to explain. Better to show three panels quickly and mark the fourth
# unavailable.
spring.cloud.openfeign.client.config.default.connect-timeout=1500
spring.cloud.openfeign.client.config.default.read-timeout=3000
resilience4j.timelimiter.configs.default.timeout-duration=10s

# Readiness covers redis but NOT db, because there is no db. Copying the usual
# readinessState,db,redis here would make the service permanently unready.
management.endpoint.health.group.readiness.include=readinessState,redis
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

spring.data.web.pageable.max-page-size=100

logging.level.root=INFO
logging.level.com.clickkart=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId:--}] %-5level %logger{36} - %msg%n

# Where the operator console's log viewer reads from. Started from the IDE, each module writes into
# its own logs/ directory and the working directory is the module, so the sibling modules are one
# level up. In Docker every service mounts the shared clickkart-logs volume, so the compose file
# overrides these two to that volume and a flat glob.
#
# The glob is configuration and never a request parameter: the caller of /api/v1/admin/logs chooses
# what to filter for, never what to open, so there is no path on the wire to traverse with.
admin.logs.root=${ADMIN_LOG_ROOT:..}
admin.logs.glob=${ADMIN_LOG_GLOB:clickkart-*/logs/*.json}

# The files roll at 100 MB and there are ten of them. Reading whole files would put a quarter of a
# gigabyte of parsing behind one page load, so only the tail is read - and the response says when it
# hit this bound rather than presenting a partial search as a complete one.
admin.logs.max-bytes-per-file=${ADMIN_LOG_MAX_BYTES_PER_FILE:8388608}
admin.logs.max-results=${ADMIN_LOG_MAX_RESULTS:500}
admin.logs.max-window-minutes=${ADMIN_LOG_MAX_WINDOW_MINUTES:1440}
