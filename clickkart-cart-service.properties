# clickkart-cart-service-dev.properties
server.port=${SERVER_PORT:8091}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clickkart_cart}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# validate, not update. Flyway owns the schema now; Hibernate only checks the entities still
# match it. A mismatch becomes a refusal to start - loud, at deploy time - instead of a silent
# ALTER nobody reviewed, which is what made ddl-auto=update unsafe outside a laptop.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# What lets Flyway be adopted on a database that already has a schema: baseline-on-migrate
# stamps an existing non-empty database rather than refusing to run, and baseline-version=1
# stamps it AT V1 so it skips V1__baseline.sql, while a fresh database runs it and gets the lot.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false

spring.data.redis.host=${REVOCATION_REDIS_HOST:localhost}
spring.data.redis.port=${REVOCATION_REDIS_PORT:6379}
spring.data.redis.password=${REVOCATION_REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=${CART_SERVICE_HOSTNAME:localhost}
eureka.client.service-url.defaultZone=http://${EUREKA_DASHBOARD_USERNAME:admin}:${EUREKA_DASHBOARD_PASSWORD:dev-only-secret-change-me}@${EUREKA_SERVER_HOST:localhost}:${EUREKA_SERVER_PORT:8761}/eureka/

cart.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum}
cart.revocation-key-prefix=${REVOCATION_KEY_PREFIX:revoked:jti:}
cart.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
cart.trusted-proxy-cidrs=${CART_TRUSTED_PROXY_CIDRS:}

# Guards this service's own /internal/** - the surface Order Service reads a basket from and empties
# after checkout. Only two operations are exposed there, and neither can add to a cart: an internal
# API that could would be a way to put items in a stranger's basket from inside the cluster.
cart.internal-api-key=${INTERNAL_API_KEY:dev-only-internal-key-change-me}
cart.product-service-api-key=${PRODUCT_SERVICE_API_KEY:dev-only-internal-key-change-me}

# Blast-radius limits, not merchandising rules. Every cart read fans out to one Product Service call
# per line, so an unbounded cart turns a single GET into an unbounded burst against a service other
# customers are also using.
cart.max-distinct-items=${CART_MAX_DISTINCT_ITEMS:50}
cart.max-quantity-per-item=${CART_MAX_QUANTITY_PER_ITEM:100}

# A cart records what somebody was thinking of buying - personal data nobody agreed to have kept
# indefinitely, and useless to them once the prices and listings in it have moved on.
cart.abandoned-after-days=${CART_ABANDONED_AFTER_DAYS:90}
# Hourly. Nothing here is time-critical, and a job that only reclaims space has no business competing
# for database connections with the ones that take money.
cart.prune-interval-ms=${CART_PRUNE_INTERVAL_MS:3600000}
cart.prune-initial-delay-ms=${CART_PRUNE_INITIAL_DELAY_MS:120000}
cart.prune-batch-size=${CART_PRUNE_BATCH_SIZE:200}

spring.cloud.openfeign.circuitbreaker.enabled=true
# Same reasoning as order-service: a 4xx from a downstream service is an answer, not a fault, and
# tripping a breaker on one would take out every customer's cart because some SKUs were delisted.
resilience4j.circuitbreaker.configs.default.ignore-exceptions[0]=feign.FeignException$Conflict
resilience4j.circuitbreaker.configs.default.ignore-exceptions[1]=feign.FeignException$NotFound

resilience4j.circuitbreaker.instances.clickkart-product-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.clickkart-product-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.clickkart-product-service.wait-duration-in-open-state=10s

# The stock client on the same service. It needs its own entry because it carries contextId
# "inventoryClient" - Inventory Service was folded into Product Service, so two Feign clients name
# the same host, and Spring derives both bean names and circuit-breaker ids from the context rather
# than the host. Same numbers as above: one service, one failure profile.
resilience4j.circuitbreaker.instances.inventoryClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventoryClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventoryClient.wait-duration-in-open-state=10s

spring.cloud.openfeign.client.config.default.connect-timeout=2000
# Rendering a cart is one call per line, like order-service's checkout, so it gets the same 5s rather
# than the 2s single-call services use.
spring.cloud.openfeign.client.config.default.read-timeout=5000
resilience4j.timelimiter.configs.default.timeout-duration=20s

management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

spring.data.web.pageable.max-page-size=100

logging.level.root=INFO
logging.level.com.clickkart=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId:--}] %-5level %logger{36} - %msg%n
