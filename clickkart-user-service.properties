# clickkart-user-service-dev.properties
server.port=${SERVER_PORT:8085}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clickkart_user}
# This service's OWN least-privilege role, never the postgres superuser, and no password default
# (fail fast rather than silently falling back to a credential that can reach another service's
# database).
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# validate, not update. Flyway owns the schema now; Hibernate only checks that the entities
# still match it. A mismatch is then a refusal to start - loud, at deploy time - instead of a
# silent ALTER nobody reviewed, which is what made ddl-auto=update unsafe outside a laptop.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# These two are what let Flyway be adopted on databases that already have a schema.
# baseline-on-migrate stamps an existing non-empty database instead of refusing to run;
# baseline-version=1 stamps it AT V1, so the existing database skips V1__baseline.sql (its
# tables are already there) while a fresh one runs it and gets the whole schema.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false

# The same Redis instance Auth Service writes revoked jtis to - this service only reads it, so a
# logged-out access token is rejected here too instead of staying usable until natural expiry.
spring.data.redis.host=${REVOCATION_REDIS_HOST:localhost}
spring.data.redis.port=${REVOCATION_REDIS_PORT:6379}
spring.data.redis.password=${REVOCATION_REDIS_PASSWORD:}
# Lettuce defaults to a 60s command timeout when unset, which turns a Redis outage into a hang
# rather than a fast failure - the JwtAuthenticationFilter's DataAccessException guard never gets
# a chance to fire in time, and the readiness probe stays UP far too long.
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=${USER_SERVICE_HOSTNAME:localhost}
eureka.client.service-url.defaultZone=http://${EUREKA_DASHBOARD_USERNAME:admin}:${EUREKA_DASHBOARD_PASSWORD:dev-only-secret-change-me}@${EUREKA_SERVER_HOST:localhost}:${EUREKA_SERVER_PORT:8761}/eureka/

# dev-only fallback secret - never rely on this default outside a local machine. MUST be the same
# value Auth Service signs tokens with and the Gateway validates against.
user.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum}
# Must match Auth Service's auth.revocation-key-prefix exactly, or logout would go unnoticed here.
user.revocation-key-prefix=${REVOCATION_KEY_PREFIX:revoked:jti:}
user.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
user.max-addresses-per-user=${MAX_ADDRESSES_PER_USER:20}
user.default-language=${DEFAULT_LANGUAGE:en}
user.default-currency=${DEFAULT_CURRENCY:INR}
# Empty means trust nothing and always use the socket address - an X-Forwarded-For from an
# untrusted hop would let a caller write a false IP into the tamper-evident audit trail.
user.trusted-proxy-cidrs=${USER_TRUSTED_PROXY_CIDRS:}

spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.instances.clickkart-audit-log-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.clickkart-audit-log-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.clickkart-audit-log-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.clickkart-audit-log-service.permitted-number-of-calls-in-half-open-state=3
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=2000
# Must stay ABOVE the feign read-timeout so feign's own timeout is the operative bound - the
# Resilience4j default of 1s would otherwise trip first and make read-timeout dead config.
resilience4j.timelimiter.configs.default.timeout-duration=12s

# db AND redis: this service cannot authenticate a single request without Redis (revocation check)
# or serve one without the database, so an outage of either must take the instance out of the k8s
# Service endpoint pool rather than merely showing up in /actuator/health.
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

logging.level.root=INFO
logging.level.com.clickkart=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId:--}] %-5level %logger{36} - %msg%n

# Shared secret guarding /internal/**, presented by calling services as X-Internal-Api-Key.
# Deliberately NOT the same value as JWT_SECRET: that one is a signature key held by three
# services, this one authenticates callers, and reusing one for both would mean anything able to
# validate a token could also call the internal API. Blank refuses every internal request rather
# than matching an empty header.
user.internal-api-key=${INTERNAL_API_KEY:dev-only-internal-key-change-me}

# ---------------------------------------------------------------------------
# Folded in from clickkart-notification-service, which no longer exists as its
# own deployable. This service already owned the in-app notification feed; it
# now owns outbound delivery too, which is the other half of the same domain.
#
# With no MAIL_HOST / MSG91_AUTH_KEY set, ProviderConfiguredConditions selects
# the logging senders instead of SMTP/Msg91 - so an unconfigured environment
# still works, it just writes the message to dispatch.log rather than sending.
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Off unless an environment actually provisions a mail server. Notification Service left this on
# and reported DOWN permanently in every environment without SMTP - a false alarm that would now
# land on a core service instead of a peripheral one. It was never in the readiness group, so it
# has never gated traffic either way; prod sets MAIL_HEALTH_ENABLED=true to get the real signal.
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

clickkart.notification.email.from=${MAIL_FROM:}
clickkart.notification.email.password-reset-subject=Reset your ClickKart password
clickkart.notification.email.otp-subject=Your ClickKart verification code
clickkart.notification.sms.msg91.auth-key=${MSG91_AUTH_KEY:}
clickkart.notification.sms.msg91.template-id=${MSG91_TEMPLATE_ID:}
clickkart.notification.sms.msg91.sender-id=${MSG91_SENDER_ID:}
clickkart.notification.sms.msg91.country-code=${MSG91_COUNTRY_CODE:91}
