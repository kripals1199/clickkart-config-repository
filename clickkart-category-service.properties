# clickkart-category-service-dev.properties
server.port=${SERVER_PORT:8086}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clickkart_category}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# validate, not update. Flyway owns the schema now; Hibernate only checks the entities still
# match it. A mismatch becomes a refusal to start - loud, at deploy time - instead of a silent
# ALTER nobody reviewed, which is what made ddl-auto=update unsafe outside a laptop.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# What lets Flyway be adopted on a database that already has a schema: baseline-on-migrate
# stamps an existing non-empty database rather than refusing to run, and baseline-version=1
# stamps it AT V1 so it skips V1__baseline.sql, while a fresh database runs it and gets the lot.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false

# The same Redis instance Auth Service writes revoked jtis to. This service only reads it, so an
# ADMIN who logged out cannot keep editing the catalog with a still-unexpired token.
spring.data.redis.host=${REVOCATION_REDIS_HOST:localhost}
spring.data.redis.port=${REVOCATION_REDIS_PORT:6379}
spring.data.redis.password=${REVOCATION_REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=${CATEGORY_SERVICE_HOSTNAME:localhost}
eureka.client.service-url.defaultZone=http://${EUREKA_DASHBOARD_USERNAME:admin}:${EUREKA_DASHBOARD_PASSWORD:dev-only-secret-change-me}@${EUREKA_SERVER_HOST:localhost}:${EUREKA_SERVER_PORT:8761}/eureka/

category.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum}
category.revocation-key-prefix=${REVOCATION_KEY_PREFIX:revoked:jti:}
category.internal-api-key=${INTERNAL_API_KEY:dev-only-internal-key-change-me}
category.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
# Root counts as 0, so 5 allows Electronics > Mobiles > Smartphones > Android > Flagship.
category.max-depth=${CATEGORY_MAX_DEPTH:5}
category.trusted-proxy-cidrs=${CATEGORY_TRUSTED_PROXY_CIDRS:}

spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.instances.clickkart-audit-log-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.clickkart-audit-log-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.clickkart-audit-log-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.clickkart-audit-log-service.permitted-number-of-calls-in-half-open-state=3
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=2000
# Above the feign read-timeout so feign's own timeout is the operative bound - the Resilience4j
# default of 1s would otherwise trip first and make read-timeout dead config.
resilience4j.timelimiter.configs.default.timeout-duration=12s

# Catalog reads need the database; ADMIN writes additionally need Redis for the revocation check.
# An outage of either should pull the instance from the Service endpoint pool.
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Caps a client-supplied ?size= so one request cannot pull the whole table.
spring.data.web.pageable.max-page-size=100

logging.level.root=INFO
logging.level.com.clickkart=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId:--}] %-5level %logger{36} - %msg%n
