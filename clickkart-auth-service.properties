# clickkart-auth-service-dev.properties
server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clickkart_auth}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# validate, not update. Flyway owns the schema now; Hibernate only checks the entities still
# match it. A mismatch becomes a refusal to start - loud, at deploy time - instead of a silent
# ALTER nobody reviewed, which is what made ddl-auto=update unsafe outside a laptop.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# What lets Flyway be adopted on a database that already has a schema: baseline-on-migrate
# stamps an existing non-empty database rather than refusing to run, and baseline-version=1
# stamps it AT V1 so it skips V1__baseline.sql, while a fresh database runs it and gets the lot.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false

# Shared with the Gateway - both must agree on where revoked-token entries live
spring.data.redis.host=${REVOCATION_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REVOCATION_REDIS_PORT:6379}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=${AUTH_SERVICE_HOSTNAME:localhost}
eureka.client.service-url.defaultZone=http://${EUREKA_DASHBOARD_USERNAME:admin}:${EUREKA_DASHBOARD_PASSWORD:dev-only-secret-change-me}@${EUREKA_SERVER_HOST:localhost}:${EUREKA_SERVER_PORT:8761}/eureka/

# dev-only fallback secret - MUST be the same value configured on the Gateway
auth.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum}
auth.access-token-ttl-seconds=${ACCESS_TOKEN_TTL_SECONDS:900}
auth.refresh-token-ttl-seconds=${REFRESH_TOKEN_TTL_SECONDS:604800}
auth.max-failed-login-attempts=${MAX_FAILED_LOGIN_ATTEMPTS:5}
auth.lockout-duration-minutes=${LOCKOUT_DURATION_MINUTES:15}
auth.password-encoder-strength=${PASSWORD_ENCODER_STRENGTH:12}
auth.refresh-token-bytes=${REFRESH_TOKEN_BYTES:64}

# Must match the Gateway's revoked-token key prefix exactly
auth.revocation-key-prefix=${REVOCATION_KEY_PREFIX:revoked:jti:}
auth.password-reset-token-ttl-seconds=${PASSWORD_RESET_TOKEN_TTL_SECONDS:1800}
auth.password-reset-token-bytes=${PASSWORD_RESET_TOKEN_BYTES:32}
auth.password-history-limit=${PASSWORD_HISTORY_LIMIT:5}

# Defense in depth - the Gateway has its own CORS config too, but this service is
# independently reachable. Safe localhost default for dev only.
auth.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}

# Per-IP-per-path fixed-window rate limit (Redis-backed) on register/login/refresh/forgot-password/
# reset-password.
auth.rate-limit-max-requests=${RATE_LIMIT_MAX_REQUESTS:10}
auth.rate-limit-window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

# Login OTP - digit length, validity window, and wrong-guess tolerance before a single issued
# code burns itself out.
auth.otp-length=${OTP_LENGTH:6}
auth.otp-ttl-seconds=${OTP_TTL_SECONDS:300}
auth.otp-max-verify-attempts=${OTP_MAX_VERIFY_ATTEMPTS:5}

# Email/mobile verification codes - a separate, more generous TTL than login OTP above, since
# confirming a contact detail isn't time-pressured the way logging in is.
auth.verification-code-ttl-seconds=${VERIFICATION_CODE_TTL_SECONDS:86400}
auth.verification-code-max-verify-attempts=${VERIFICATION_CODE_MAX_VERIFY_ATTEMPTS:5}

# Comma-separated CIDRs/IPs of proxies allowed to set X-Forwarded-For (e.g. the Gateway's own
# address) - unset/empty means "trust nothing but the immediate socket address", which is safe
# by default everywhere (fails toward more restrictive, not less) but means rate-limiting will
# bucket every request behind a real, unconfigured proxy under that proxy's own IP.
auth.trusted-proxy-cidrs=${AUTH_TRUSTED_PROXY_CIDRS:}

spring.security.user.name=${AUTH_SERVICE_ADMIN_USERNAME:admin}
spring.security.user.password=${AUTH_SERVICE_ADMIN_PASSWORD:dev-only-secret-change-me}

spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.instances.clickkart-audit-log-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.clickkart-audit-log-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.clickkart-audit-log-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.clickkart-audit-log-service.permitted-number-of-calls-in-half-open-state=3
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=2000

# Resilience4j's own TimeLimiter defaults to a 1s timeout when unconfigured, which is shorter
# than the 2s feign read-timeout above - so it was tripping BEFORE feign's own timeout ever got
# a chance, making read-timeout dead config. Confirmed live via a real forgot-password call that
# spuriously 503'd after ~1s even though notification-service was healthy and responded fine.
# Set above the feign read-timeout so feign's own timeout is the operative bound.
resilience4j.timelimiter.configs.default.timeout-duration=12s

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
# Without this, Spring Boot's default readiness group is just readinessState - a Redis or DB
# outage wouldn't fail /actuator/health/readiness at all, so k8s would keep routing traffic to a
# pod that will 503 every rate-limited/revocation-checked request. db included too: a DB outage
# is equally fatal to every request and was never explicitly wired into readiness either.
management.endpoint.health.group.readiness.include=readinessState,db,redis

logging.level.root=INFO
logging.level.com.clickkart=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId:--}] %-5level %logger{36} - %msg%n
# Routed to logs/sql.log by logback-spring.xml's dedicated SQL appender - DEBUG only in dev/test.
sql.log-level=DEBUG

# Notification calls now perform a real SMTP send, which is far slower than the simulated
# dispatch these timeouts were originally tuned against. With the default 2s read-timeout the
# call timed out while the email was still being delivered - Auth Service returned 503 and
# rolled back, so the reset token was never persisted even though the user had already received
# an email containing it. A token that cannot be redeemed is worse than no email at all.
#
# Per-client, deliberately: audit-log and captcha calls keep the fast default, because for them
# a slow response is a genuine fault rather than expected protocol cost.
spring.cloud.openfeign.client.config.clickkart-user-service.connect-timeout=2000
spring.cloud.openfeign.client.config.clickkart-user-service.read-timeout=10000

# ---------------------------------------------------------------------------
# Folded in from clickkart-captcha-service, which no longer exists as its own
# deployable. Values are unchanged: the challenge budget stays more generous
# than auth.rate-limit-max-requests because issuing a challenge costs an image
# render, and a user who mistypes one legitimately needs another.
# The challenge store is Redis, which this service already connects to for the
# token revocation list - no new dependency.
# ---------------------------------------------------------------------------
captcha.code-length=${CAPTCHA_CODE_LENGTH:6}
captcha.ttl-seconds=${CAPTCHA_TTL_SECONDS:120}
captcha.image-width=${CAPTCHA_IMAGE_WIDTH:200}
captcha.image-height=${CAPTCHA_IMAGE_HEIGHT:70}
captcha.challenge-rate-limit-max-requests=${CAPTCHA_RATE_LIMIT_MAX_REQUESTS:20}
captcha.challenge-rate-limit-window-seconds=${CAPTCHA_RATE_LIMIT_WINDOW_SECONDS:60}

# Notification dispatch moved onto User Service's guarded /internal surface, so this service finally
# needs a credential for a service-to-service call. Attached by InternalApiKeyRequestInterceptor,
# and only to /internal/ paths - the audit-log client does not get it. Must match the value every
# other service holds; blank fails closed at the receiving end.
auth.internal-api-key=${INTERNAL_API_KEY:dev-only-internal-key-change-me}
