# clickkart-audit-log-service-dev.properties
server.port=${SERVER_PORT:8083}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clickkart_audit_log}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# validate, not update. Flyway owns the schema now; Hibernate only checks the entities still
# match it. A mismatch becomes a refusal to start - loud, at deploy time - instead of a silent
# ALTER nobody reviewed, which is what made ddl-auto=update unsafe outside a laptop.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# What lets Flyway be adopted on a database that already has a schema: baseline-on-migrate
# stamps an existing non-empty database rather than refusing to run, and baseline-version=1
# stamps it AT V1 so it skips V1__baseline.sql, while a fresh database runs it and gets the lot.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=${AUDIT_LOG_SERVICE_HOSTNAME:localhost}
eureka.client.service-url.defaultZone=http://${EUREKA_DASHBOARD_USERNAME:admin}:${EUREKA_DASHBOARD_PASSWORD:dev-only-secret-change-me}@${EUREKA_SERVER_HOST:localhost}:${EUREKA_SERVER_PORT:8761}/eureka/

management.endpoint.health.group.readiness.include=readinessState,db
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

logging.level.root=INFO
logging.level.com.clickkart=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId:--}] %-5level %logger{36} - %msg%n
