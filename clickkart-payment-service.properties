# clickkart-payment-service-dev.properties
server.port=${SERVER_PORT:8090}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clickkart_payment}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# validate, not update. Flyway owns the schema now; Hibernate only checks the entities still
# match it. A mismatch becomes a refusal to start - loud, at deploy time - instead of a silent
# ALTER nobody reviewed, which is what made ddl-auto=update unsafe outside a laptop.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# What lets Flyway be adopted on a database that already has a schema: baseline-on-migrate
# stamps an existing non-empty database rather than refusing to run, and baseline-version=1
# stamps it AT V1 so it skips V1__baseline.sql, while a fresh database runs it and gets the lot.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false

spring.data.redis.host=${REVOCATION_REDIS_HOST:localhost}
spring.data.redis.port=${REVOCATION_REDIS_PORT:6379}
spring.data.redis.password=${REVOCATION_REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=${PAYMENT_SERVICE_HOSTNAME:localhost}
eureka.client.service-url.defaultZone=http://${EUREKA_DASHBOARD_USERNAME:admin}:${EUREKA_DASHBOARD_PASSWORD:dev-only-secret-change-me}@${EUREKA_SERVER_HOST:localhost}:${EUREKA_SERVER_PORT:8761}/eureka/

payment.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum}
payment.revocation-key-prefix=${REVOCATION_KEY_PREFIX:revoked:jti:}
payment.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
payment.trusted-proxy-cidrs=${PAYMENT_TRUSTED_PROXY_CIDRS:}

# Guards this service's own /internal/** - read-only, so a leak here discloses rather than tampers.
payment.internal-api-key=${INTERNAL_API_KEY:dev-only-internal-key-change-me}
# Presented to Order Service, both to read the amount and to report the outcome. This is the most
# dangerous credential this service holds: it can declare any order paid for.
payment.order-service-api-key=${ORDER_SERVICE_API_KEY:dev-only-internal-key-change-me}

# 'simulated' moves NO MONEY. Every payment it produces is stamped simulated=true in the database
# and in the API response, and PaymentGatewayConfiguration refuses to start under the prod profile
# with this value - a production service that fakes captures would let orders ship against money
# that never existed, and nobody would notice until a bank statement was reconciled.
payment.gateway-provider=${PAYMENT_GATEWAY_PROVIDER:simulated}
payment.currency=${PAYMENT_CURRENCY:INR}

# Non-zero on purpose. A simulator that always succeeds lets a whole team build against a world
# where payments never decline, and the decline path - which has to release stock and tell the
# customer - then gets exercised for the first time in production.
payment.simulated-failure-percent=${SIMULATED_FAILURE_PERCENT:10}
payment.simulated-pending-percent=${SIMULATED_PENDING_PERCENT:10}
# Exact amounts that always decline / always come back pending, so a test can force the path
# deterministically instead of retrying until the dice land.
payment.simulated-decline-amount=${SIMULATED_DECLINE_AMOUNT:13.13}
payment.simulated-pending-amount=${SIMULATED_PENDING_AMOUNT:17.17}

# The entire access control on /webhooks/v1/payments/gateway, the one route here with no bearer
# token and no shared secret. Blank rejects every webhook, which is the correct posture: failing
# closed costs a config error, failing open costs the goods.
payment.webhook-secret=${WEBHOOK_SECRET:dev-only-webhook-secret-change-me}
payment.webhook-tolerance-seconds=${WEBHOOK_TOLERANCE_SECONDS:300}

# Re-reports outcomes Order Service never acknowledged. Every row it finds is a customer whose money
# moved against an order that does not know it, so this is deliberately frequent.
payment.reconcile-interval-ms=${RECONCILE_INTERVAL_MS:60000}
payment.reconcile-initial-delay-ms=${RECONCILE_INITIAL_DELAY_MS:45000}
# The stale sweep is offset from the reconcile pass rather than sharing its start, so the two do not
# interleave on the same table and delay each other.
payment.stale-sweep-initial-delay-ms=${STALE_SWEEP_INITIAL_DELAY_MS:75000}
payment.reconcile-batch-size=${RECONCILE_BATCH_SIZE:200}
# After this many failed attempts the reconciler gives up and the payment moves to an operator
# queue. Not unlimited: a payment that has failed twenty times has something another retry will not
# fix, and a row retried forever is a row nobody ever looks at.
payment.max-outcome-report-attempts=${MAX_OUTCOME_REPORT_ATTEMPTS:20}

spring.cloud.openfeign.circuitbreaker.enabled=true

# A 409 must never count as a circuit-breaker failure, on any client here. Enabling the Feign
# breaker applies one to EVERY client, so this cannot be arranged by omitting an instance block.
# Order Service returns 409 for ordinary business refusals; without this, a run of customers paying
# for orders that had already expired would trip the breaker and stop payment for everyone.
# "default" is Resilience4j's base config - every instance below inherits it without asking.
resilience4j.circuitbreaker.configs.default.ignore-exceptions[0]=feign.FeignException$Conflict

resilience4j.circuitbreaker.instances.clickkart-audit-log-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.clickkart-audit-log-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.clickkart-audit-log-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.clickkart-order-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.clickkart-order-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.clickkart-order-service.wait-duration-in-open-state=10s

# Order Service has no Feign fallback here. A fallback must return something, and neither call has a
# safe substitute: inventing an amount would charge a figure nothing authorised, and pretending an
# outcome was delivered would leave a paid order stuck awaiting payment with nothing left to fix it.
spring.cloud.openfeign.client.config.default.connect-timeout=2000
# 5s, matching Order Service. A payment processor is slower than any other dependency here, and the
# 2s the earlier services use timed out a healthy Product Service on its first cold call.
spring.cloud.openfeign.client.config.default.read-timeout=5000
resilience4j.timelimiter.configs.default.timeout-duration=20s

management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

spring.data.web.pageable.max-page-size=100

logging.level.root=INFO
logging.level.com.clickkart=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId:--}] %-5level %logger{36} - %msg%n
